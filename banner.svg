<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b4a"/>
      <stop offset="1" stop-color="#0e7a8a"/>
    </linearGradient>
  </defs>
  <style>
    .wave { transform-origin: 356px 292px; animation: wave 1.6s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform: rotate(0deg);} 50% { transform: rotate(-26deg);} }
    .eyes { transform-origin: 240px 208px; animation: blink 4.4s ease-in-out infinite; }
    @keyframes blink { 0%, 91%, 100% { transform: scaleY(1);} 94% { transform: scaleY(0.08);} 97% { transform: scaleY(1);} }
    .note { animation: floatUp 3.6s ease-in infinite; opacity: 0; }
    .n2 { animation-delay: 1.2s; } .n3 { animation-delay: 2.4s; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 0;} 25% { opacity: 0.95;} 100% { transform: translateY(-90px); opacity: 0;} }
    .code { animation: pulse 1.8s ease-in-out infinite; }
    .c2 { animation-delay: 0.4s; } .c3 { animation-delay: 0.8s; }
    @keyframes pulse { 0%,100% { opacity: 0.35;} 50% { opacity: 1;} }
    .halo { animation: drift 7s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translateX(0);} 50% { transform: translateX(-24px);} }
  </style>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle class="halo" cx="1020" cy="160" r="150" fill="#ffffff" opacity="0.14"/>
  <text x="64" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff">Pradeep Meena</text>
  <text x="66" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#bfeef5">AI Builder from India — Creator of Mimu</text>
  <text x="66" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#7ee0d2">Founder, RS WORLDWIDE MUSIC</text>
